services:
  db:
    image: postgres:17-alpine
    container_name: blihops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: blihops
      POSTGRES_PASSWORD: blihops
      POSTGRES_DB: blihops
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blihops -d blihops']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
